<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodegas Fuentenarro</title>
    
    <!-- 1. Cargamos la librería de Supabase correctamente -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #111;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 20px;
        }
        h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
        }
        .producto-card {
            background: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid #e5e5e5;
            padding: 10px;
        }
        .producto-card:hover {
            opacity: 0.85;
        }
        .producto-imagen {
            width: 100%;
            height: 350px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }
        .producto-info {
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .producto-nombre {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 4px 0;
        }
        .producto-precio {
            font-size: 14px;
            color: #666;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            width: 400px;
            max-width: 90%;
            position: relative;
        }
        .cerrar {
            position: absolute;
            top: 15px; right: 15px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bodegas Fuentenarro</h1>
        
        <!-- Este contenedor cambiará según si el usuario está logueado o no -->
        <div id="auth-container" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="email" id="email-input" placeholder="Correo electrónico" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
            <input type="password" id="password-input" placeholder="Contraseña" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
            <button onclick="registrarConEmail()" style="background: #333; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px;">Registrarse</button>
            <button onclick="iniciarSesionConEmail()" style="background: #333; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px;">Entrar con Email</button>
            <button onclick="iniciarSesionGoogle()" style="background: #4285F4; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px; font-weight: 500;">Google</button>
        </div>
    </header>

    <main class="grid-productos">
        <div class="producto-card" onclick="abrirModal('Fuentenarro 4 meses en barrica', '15,00 €', 'Un vino con cuerpo, notas de roble y frutos rojos maduros.')">
            <div class="producto-imagen">
                <img src="4_meses_barrica.jpg" alt="Vino tinto" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="producto-info">
                <div>
                    <h3 class="producto-nombre">Fuentenarro 4 meses en barrica</h3>
                    <small style="color:#777;">D.O. Ribera de Duero</small>
                </div>
                <span class="producto-precio">15,00 €</span>
            </div>
        </div>

        <div class="producto-card" onclick="abrirModal('Vino Blanco Verdejo', '12,50 €', 'Fresco, frutal y con un toque herbáceo ideal para pescados.')">
            <div class="producto-imagen">[Foto Botella Vino]</div>
            <div class="producto-info">
                <div>
                    <h3 class="producto-nombre">Vino Blanco Verdejo</h3>
                    <small style="color:#777;">D.O. Rueda</small>
                </div>
                <span class="producto-precio">12,50 €</span>
            </div>
        </div>
    </main>

    <div id="modal">
        <div class="modal-content">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-titulo" style="margin-top:0;"></h2>
            <p id="modal-desc" style="color: #666; font-size: 14px;"></p>
            <p id="modal-precio" style="font-weight: bold; font-size: 16px;"></p>
            
            <div style="margin: 20px 0;">
                <label for="unidades">Unidades:</label>
                <input type="number" id="unidades" value="1" min="1" style="width: 50px; padding: 5px;">
            </div>
            
            <button style="width: 100%; background: #000; color: #fff; border: none; padding: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">Añadir al carrito</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://wifukeifpabvxuiwpeao.supabase.co'
        const supabaseKey = 'sb_publishable_kzSSg5V2d2YVdvSpfLzKlg_ZWeJUPr2'
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey)

        // Comprobar la sesión al cargar la página
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            actualizarInterfaz(session);
        });

        // Función para pintar la interfaz según el estado
        function actualizarInterfaz(session) {
            const container = document.getElementById('auth-container');
            
            if (session) {
                // Si el usuario ha iniciado sesión
                const emailUsuario = session.user.email;
                container.innerHTML = `
                    <span style="font-size: 13px; color: #333;">Hola, <strong>${emailUsuario}</strong></span>
                    <button onclick="cerrarSesion()" style="background: #d9534f; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px;">Cerrar sesión</button>
                `;
            } else {
                // Si NO hay sesión, mostramos los formularios de acceso de nuevo
                container.innerHTML = `
                    <input type="email" id="email-input" placeholder="Correo electrónico" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
                    <input type="password" id="password-input" placeholder="Contraseña" style="padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
                    <button onclick="registrarConEmail()" style="background: #333; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px;">Registrarse</button>
                    <button onclick="iniciarSesionConEmail()" style="background: #333; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px;">Entrar con Email</button>
                    <button onclick="iniciarSesionGoogle()" style="background: #4285F4; color: #fff; border: none; padding: 7px 12px; cursor: pointer; font-size: 12px; border-radius: 4px; font-weight: 500;">Google</button>
                `;
            }
        }

        // Inicio de sesión con Google
        async function iniciarSesionGoogle() {
            const { data, error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: 'https://fuentenarrobodegas-oss.github.io/compra_online_vino/'
                }
            })
            if (error) alert('Error al iniciar sesión: ' + error.message)
        }

        // Registro con Correo y Contraseña
        async function registrarConEmail() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                alert('Error al registrarse: ' + error.message);
            } else {
                alert('¡Registro exitoso! Ya puedes iniciar sesión.');
            }
        }

        // Inicio de sesión con Correo y Contraseña
        async function iniciarSesionConEmail() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
            } else {
                location.reload(); // Recarga para aplicar la sesión
            }
        }

        // Cerrar sesión
        async function cerrarSesion() {
            await _supabase.auth.signOut();
            location.reload();
        }

        function abrirModal(nombre, precio, desc) {
            document.getElementById('modal-titulo').innerText = nombre;
            document.getElementById('modal-precio').innerText = precio;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal').style.display = 'flex';
        }
        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
